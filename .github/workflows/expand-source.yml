name: Expand reviewed source snapshot
on:
  push:
    branches:
      - ai-studio-secure-sync-20261008
    paths:
      - lamsa-secure-source-snapshot.zip
      - .github/workflows/expand-source.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Expand archive without overwriting repository files
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import shutil, zipfile
          root = Path.cwd().resolve()
          archive = root / 'lamsa-secure-source-snapshot.zip'
          blocked_dirs = {'.git', 'node_modules', 'dist'}
          blocked_files = {'.env', '.env.local', '.env.production', '.DS_Store'}
          seen = set()
          created = 0
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  raw = info.filename
                  if chr(92) in raw:
                      raise SystemExit('Unsafe archive path')
                  rel = PurePosixPath(raw)
                  if rel.is_absolute() or '..' in rel.parts or not rel.parts:
                      raise SystemExit('Unsafe archive path')
                  key = rel.as_posix()
                  if key in seen:
                      raise SystemExit('Duplicate archive path')
                  seen.add(key)
                  if key == 'README.md' or rel.name in blocked_files or any(part in blocked_dirs for part in rel.parts):
                      continue
                  dest = root.joinpath(*rel.parts)
                  if root not in dest.resolve().parents:
                      raise SystemExit('Unsafe archive destination')
                  if dest.exists():
                      if key == '.gitignore':
                          continue
                      raise SystemExit('Refusing to overwrite existing repository file')
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as source, dest.open('xb') as target:
                      shutil.copyfileobj(source, target)
                  created += 1
          print(f'Added {created} new files; no existing files were replaced.')
          PY
      - name: Commit only newly added files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No new files to commit.'
            exit 0
          fi
          git commit -m 'Expand reviewed AI Studio source'
          git push origin "$GITHUB_REF_NAME"
